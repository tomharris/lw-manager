# Frames of the roster probe's capture.
#
# Capture 1, account 16, 2026-08-14, the alliance member list walked one rank
# group at a time. Committed as a frame list only -- there is no hand-checked
# transcription of this capture the way fixtures/m4gate/expected.yaml is one
# for the VS ranking, and this file must not be mistaken for ground truth.
#
# The probe scores name reads against the 86 names in fixtures/m4gate's
# expected.yaml instead, which ARE hand-transcribed. Two caveats that the
# probe's own output repeats, because they bound what its numbers can mean:
#
#   - those 86 are the VS ranking's scorers, and this alliance had 97 members,
#     so a read can be correct and match nothing;
#   - the two captures are three days apart, so the rosters are not identical.
#
# What the probe measures is therefore a LOWER bound on name accuracy, and the
# number to watch is not the absolute count but the "leading junk token"
# counter, which is a defect measure and does not depend on the truth set
# being complete.
#
# group_key marks the one alliance-summary frame, which carries no member rows;
# the probe skips it.
