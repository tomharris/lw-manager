# The M4 roster gate's hand-transcribed capture.
#
# Capture 1, account 16, 2026-08-14: the alliance MEMBER LIST walked one rank
# group at a time, 62 frames at 720x1600. Transcribed by eye out of the blob
# store, one frame at a time at full resolution -- not from `control ingest`'s
# summary, not from a `members` or `review_queue` query, and not from a
# previous run of this gate. README.md in this directory says why that
# distinction is the whole point of the file, and CLAUDE.md records what it
# cost this project to learn it.
#
# THE CAPTURE HOLDS 75 MEMBERS, NOT 84. Pre-flight recorded R4 "This Is It" as
# expanded with nine rows to read. It is not: seq 1 is the only frame in the
# capture that shows R4's header at all, it reads "2/9" with the UP chevron,
# and R3 "Footloose 10/64" follows it immediately with no rows in between. The
# chevron's polarity is settled by the frames themselves rather than assumed --
# R3 (10/64) and R2 (1/11) both carry the DOWN chevron and are both followed by
# exactly as many rows as their headers state, 64 and 11 counted; R4 (2/9) and
# R1 (0/12) both carry the UP chevron and are followed by none. So R4 is
# collapsed in capture 1 exactly as R1 is, and its nine members have no rows
# anywhere to have been read from. All four headers are still recorded at their
# true totals, which is what keeps the arithmetic the screen states twice
# intact: 9 + 64 + 11 + 12 = 96, plus leader RobElr in the banner = 97.
#
# THE RULE: a value is recorded only where it reads identically in every frame
# the member appears in. Capture 1 sweeps the same stretch of list repeatedly
# -- seq 26 onward re-reads R3's tail, the whole of R2, and R1's closed header,
# over and over -- so most rows here were read three or more times, and every
# power and level agreed on every reading.
#
# ONE FIELD CANNOT OBEY THAT RULE AND IS RECORDED DIFFERENTLY. last_active is
# an elapsed time, and it advances while the capture runs: Rudester17 reads
# "1m ago" on seq 22 and "11m ago" on seq 58, albambet "7h ago" on seq 20 and
# "8h ago" on seq 26. That is the clock moving, not a disagreement between
# frames, so the value recorded is the one on the EARLIEST frame the row
# appears in, and a later frame reading one step further on confirms the row
# rather than contradicting it. Anything downstream that asserts last_active
# has to account for that; nothing does today.
#
# FIVE MEMBERS CARRY A NOTE, all of them for the same reason: an ornament or a
# fallback-font glyph that is a best reading rather than a certain one. They
# get the standing fixtures/m4gate/expected.yaml gives its thirteen decorated
# names -- recorded rather than dropped, because dropping them would be editing
# the ground truth to suit the parser, and asserted rather than excused,
# because the note is what a failure should be re-read against before the
# pipeline is blamed. Where a note names a disagreement with the VS fixture
# ("ZaP") it is a disagreement between two hand readings of the same player,
# not a defect in either.
#
# The four other decorated names are NOT noted, and the distinction is the
# point of the field: 한씨아저씨, Danny 狂, ٣١٢ A l i ٣١٢ and M I C H E L L are
# each unambiguous at full resolution, whatever an English-only tesseract makes
# of them. Non-Latin is not the same thing as uncertain.
#
# WHAT IS NOT UNCERTAIN, and is called out because the pipeline currently reads
# each of them differently: Biias Fortes carries two dotted i's of equal height
# at 8x and is not "Bilas"; ALBAN80 ends in the digits 8 and 0, not "SO";
# 19GENERALS68 ends in 8, not S; Bwiz21 and Delio1 end in the digit 1;
# AA91AA carries 9 and 1 between the A pairs, not "SI"; King SiUuUU is
# S-i-U-u-U-U. Those are confusables in the engine, not ambiguities in the
# pixels, and this file is the thing that disagrees with the engine.
#
# game_version is not printed on this screen. 1.0.358 is what
# fixtures/corpus/index.yaml records for every frame captured on 2026-08-12 and
# 2026-08-13 and what fixtures/m4gate/expected.yaml records for capture 6 on
# 2026-08-17; capture 1 sits between them, on the same handset. It is stated
# here for the reason the field exists at all -- it is what later explains a
# gate that used to pass and now does not -- and it is an inference from those
# two observations rather than something read off a frame.
#
# Provenance only. The gate seeds its own capture row in lw_manager_test and
# never looks this id up; it is here so a puzzling row can be traced back.
capture: 1
period_key: "2026-W33"
game_version: "1.0.358"

alliance:
  tag: "OrCa"
  name: "Organized Chaos"
  # "Members: 97/100" on seq 0, the one frame carrying the alliance summary.
  member_count: 97
  # RobElr occupies the MEMBER LIST banner and has no rank-group row, which is
  # why the group totals sum to 96 rather than 97.
  leader: "RobElr"

