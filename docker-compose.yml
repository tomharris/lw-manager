services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lw
      POSTGRES_PASSWORD: lw
      POSTGRES_DB: lw_manager
    # 5433 on the host: 5432 is commonly already taken by another project's
    # container or a host postgres. The container port is unchanged.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lw -d lw_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
